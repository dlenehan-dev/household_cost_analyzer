[project]
name = "household-cost-analyzer"
version = "0.1.0"
description = "Household cost analysis and reporting tool"
requires-python = ">=3.11"

dependencies = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
[project.scripts]
household-cost-analyzer="household_cost_analyzer.main:main"
[tool.setuptools.packages.find]
include = ["household_cost_analyzer"]
